<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный Тест</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #1c1e21;
            --btn-bg: #007bff;
            --btn-text: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #18191a;
            --card-bg: #242526;
            --text-color: #e4e6eb;
            --btn-bg: #2f80ed;
            --btn-text: #ffffff;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        p {
            font-size: 16px;
            color: #65676b;
        }

        [data-theme="dark"] p {
            color: #b0b3b8;
        }

        .btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px 5px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background-color: #6c757d;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Привет от HTML5! 👋</h1>
        <p>Этот шаблон содержит CSS-переменные и простой JavaScript для проверки интерактивности.</p>

        <button class="btn" onclick="showAlert()">Нажми меня</button>
        <button class="btn btn-secondary" onclick="toggleTheme()">Сменить тему</button>
    </div>

    <script>
        function showAlert() {
            alert('Ура! Скрипты на странице работают корректно.');
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }
    </script>

</body>
</html>
